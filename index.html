<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | off Grid</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">off Grid</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/port.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/port.data.unityweb",
        frameworkUrl: buildUrl + "/port.framework.js.unityweb",
        codeUrl: buildUrl + "/port.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Axom",
        productName: "off Grid",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      // Downloads chunks sequentially to avoid ERR_HTTP2_FLOW_CONTROL_ERROR
      async function fetchAndMergeDataParts(partUrls, onProgress) {
        const blobs = [];
        for (let i = 0; i < partUrls.length; i++) {
          const url = partUrls[i];
          const response = await fetch(url, { cache: "default" });
          if (!response.ok) {
            throw new Error("Failed to download data chunk: " + url + " (Status: " + response.status + ")");
          }
          const chunkBlob = await response.blob();
          blobs.push(chunkBlob);
          if (onProgress) {
            onProgress((i + 1) / partUrls.length);
          }
        }
        const mergedBlob = new Blob(blobs, { type: "application/octet-stream" });
        return URL.createObjectURL(mergedBlob);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          // 1. Download and merge the 3 chunks sequentially (0% to 50% progress)
          const mergedDataUrl = await fetchAndMergeDataParts(
            [
              buildUrl + "/port.data.part_aa",
              buildUrl + "/port.data.part_ab",
              buildUrl + "/port.data.part_ac",
            ],
            (chunkProgress) => {
              progressBarFull.style.width = (50 * chunkProgress) + "%";
            }
          );

          // 2. Point Unity's config to the merged in-memory file
          config.dataUrl = mergedDataUrl;

          // 3. Boot Unity (50% to 100% progress)
          const unityInstance = await createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (50 + 50 * progress) + "%";
          });

          // 4. Clean up temporary Blob URL and hide loading bar
          URL.revokeObjectURL(mergedDataUrl);
          loadingBar.style.display = "none";
          if (fullscreenButton) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        } catch (message) {
          alert(message);
        }
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
